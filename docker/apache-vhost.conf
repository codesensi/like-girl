<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        # 拒绝直接访问以点号开头的隐藏文件（.htaccess 等）
        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>
    </Directory>

    # 阻止通过 URL 直接访问应用代码 / 数据 / 配置目录（纵深防御，
    # 即使文档根配置出现偏差也不会暴露敏感文件）
    <DirectoryMatch "^/var/www/html/(app|storage|database|docker)">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
